
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo">✦</div>
            <div>
                <h1>College AI Assistant</h1>
                <p>Ask questions about college policies</p>
            </div>
            <span class="status">Local RAG</span>
        </header>

        <section id="chat" class="chat" aria-live="polite">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">✦</div>
                <h2>How can I help you?</h2>
                <p>Ask anything about the documents in your knowledge base.</p>

                <div class="suggestions">
                    <button class="suggestion">What is the minimum attendance?</button>
                    <button class="suggestion">What are the hostel rules?</button>
                    <button class="suggestion">When are semester exams conducted?</button>
                </div>
            </div>
        </section>

        <form id="question-form" class="composer">
            <textarea
                id="question"
                placeholder="Ask a question about college policies..."
                rows="1"
                aria-label="Your question"
                required
            ></textarea>
            <button id="send-button" type="submit" aria-label="Send question">
                ➤
            </button>
        </form>

        <p class="footer">
            Answers are generated from your documents. Verify important information.
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
